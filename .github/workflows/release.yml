name: Release

# Tag a commit to publish: `git tag v0.1.0 && git push origin v0.1.0`.
# Manual runs build and upload artifacts without creating a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so a Flutter release cannot silently change what ships.
  FLUTTER_VERSION: '3.47.4'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath benterm-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-windows-x64
          path: benterm-windows-x64.zip

  linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: tar -czf benterm-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-linux-x64
          path: benterm-linux-x64.tar.gz

  macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      # Unsigned: Gatekeeper will need a right-click > Open on first launch.
      # Signing needs an Apple Developer certificate in repository secrets.
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent benterm.app \
            "$GITHUB_WORKSPACE/benterm-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-macos
          path: benterm-macos.zip

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No signing config, so this is debug-key signed: fine for sideloading
      # onto your own devices, not publishable to Play.
      - run: flutter build apk --release
      - name: Rename
        run: mv build/app/outputs/flutter-apk/app-release.apk benterm-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-android
          path: benterm-android.apk

  release:
    name: Publish release
    needs: [windows, linux, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Desktop builds are unsigned; the Android APK is signed with a
            debug key. Both mean an OS warning on first launch.
