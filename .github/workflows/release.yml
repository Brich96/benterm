name: Release

# Tag a commit to publish: `git tag v0.1.0 && git push origin v0.1.0`.
# Manual runs build and upload artifacts without creating a release.
#
# Windows and Android build every time. macOS and Linux are kept here but
# parked until they are worked out: tick `build_macos_linux` on a manual run
# to exercise them without holding up a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_macos_linux:
        description: 'Also build macOS and Linux'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Pinned so a Flutter release cannot silently change what ships.
  FLUTTER_VERSION: '3.47.4'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      # Build flags for the platform jobs, so the shipped version always
      # matches the tag instead of whatever pubspec.yaml happens to say.
      build_args: ${{ steps.version.outputs.args }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Android needs a build number that only ever increases, and
            # the run number is monotonic for the life of the workflow.
            echo "args=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "Building version $version"
          else
            # Untagged run: keep the pubspec version as-is.
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release ${{ needs.test.outputs.build_args }}
      - name: Package
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath benterm-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-windows-x64
          path: benterm-windows-x64.zip

  linux:
    name: Build Linux
    needs: test
    if: inputs.build_macos_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release ${{ needs.test.outputs.build_args }}
      - name: Package
        run: tar -czf benterm-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-linux-x64
          path: benterm-linux-x64.tar.gz

  macos:
    name: Build macOS
    needs: test
    if: inputs.build_macos_linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release ${{ needs.test.outputs.build_args }}
      # Unsigned: Gatekeeper will need a right-click > Open on first launch.
      # Signing needs an Apple Developer certificate in repository secrets.
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent benterm.app \
            "$GITHUB_WORKSPACE/benterm-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-macos
          path: benterm-macos.zip

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Every build must carry the same signature, or Android refuses to
      # install one release over another and in-app updates cannot work.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release signed with a throwaway key cannot be updated in place"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/benterm-release.p12
          # PKCS12 uses one password for both the store and the key.
          {
            echo "storeFile=benterm-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release ${{ needs.test.outputs.build_args }}
      - name: Verify the APK carries the release signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # A release signed with the wrong key installs once and then blocks
          # every future update, so fail the build rather than publish it.
          expected=$(openssl pkcs12 -in android/app/benterm-release.p12 -passin env:KEYSTORE_PASSWORD -nokeys -clcerts | openssl x509 -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d" " -f1)
          python3 tool/verify_apk_signature.py build/app/outputs/flutter-apk/app-release.apk --expect "$expected"
      - name: Rename
        run: mv build/app/outputs/flutter-apk/app-release.apk benterm-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: benterm-android
          path: benterm-android.apk

  release:
    name: Publish release
    needs: [windows, linux, macos, android]
    # A skipped job would skip this one too, so depend on results rather
    # than on completion: parked platforms must not block a release, and a
    # broken one must not ship a half-empty release either.
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.windows.result == 'success'
      && needs.android.result == 'success'
      && needs.linux.result != 'failure'
      && needs.macos.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksum the artifacts
        # Lets the in-app updater confirm a download arrived intact before
        # it installs it.
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Desktop builds are unsigned; the Android APK is signed with a
            debug key. Both mean an OS warning on first launch.
